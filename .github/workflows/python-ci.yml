name: 🧪 CI - Python UV

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  lint:
    name: 🔍 Lint code with Ruff
    runs-on: ubuntu-latest
    env:
      UV_EXTRA_INDEX_URL="https://_json_key_base64:${{ secrets.PYTHON_PASSWORD }}@${{ secrets.ARTIFACT_URL }}"

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ❄️ Install uv and create virtual environment
        run: |
          pip install uv
          uv venv .venv
          uv sync --group format --no-default-groups

      - name: 🔧 Run Ruff Lint
        run: .venv/bin/ruff check src/

  test:
    name: 🧪 Run Tests with Coverage
    runs-on: ubuntu-latest
    needs: lint
    env:
      UV_EXTRA_INDEX_URL="https://_json_key_base64:${{ secrets.PYTHON_PASSWORD }}@${{ secrets.ARTIFACT_URL }}"

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ❄️ Install uv and create virtual environment
        run: |
          pip install uv
          uv venv .venv
          uv sync --all-extras --all-groups

      - name: 🧪 Run Tests
        run: .venv/bin/pytest --cov=src tests/ -W ignore::DeprecationWarning --cov-report=xml --cov-report=term-missing

      - name: 📊 Upload Coverage Report to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: alrodsa/sakugaflow

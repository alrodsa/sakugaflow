name: 🧪 CI - Python UV

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
    runs-on: ubuntu-latest
    needs: lint
    env:
      UV_EXTRA_INDEX_URL: "https://_json_key_base64:${{ secrets.PYTHON_PASSWORD }}@${{ secrets.ARTIFACT_URL }}"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install uv and venv
        run: |
          pip install uv
          uv venv .venv
          uv sync --all-extras --all-groups
      - name: Run tests
        run: .venv/bin/pytest --cov=src tests/ -W ignore::DeprecationWarning --cov-report=xml --cov-report=term-missing


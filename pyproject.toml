[project]
name = "sakugaflow"
version = "0.10.0"
description = "A tool for fps-booting your anime episodes with AI."
readme = "README.md"
requires-python = "==3.10.*"
license = { text = "Apache-2.0" }

authors = [
  { name = "Alvaro Rodriguez" }
]

dependencies = [
  "ipykernel>=6.29.5",
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "torchaudio>=2.6.0",
  "opencv-python>=4.11.0.86",
  "pydantic>=2.10.6",
  "fire>=0.7.0",
  "saibyo>=0.1.0",
]

[project.optional-dependencies]
format = ["ruff>=0.1.14"]
test = [
  "pytest>=7.4.4",
  "pytest-cov>=4.1.0"
]
publish = ["uv"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
